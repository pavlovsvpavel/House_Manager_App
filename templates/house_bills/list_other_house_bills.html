{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block extra_head_scripts %}
    <script nonce="{{ csp_nonce }}" src="{% static "scripts/htmx.min.js" %}" defer></script>
    <script nonce="{{ csp_nonce }}" src="{% static "scripts/billsPayments.js" %}" defer></script>
{% endblock %}

{% block main_content %}

    <section class="site-section list-house-bills">
        <div class="container">
            <div class="wrapper">
                <div class="title-back-btn">
                    <h3>{% trans 'Other bills' %}</h3>
                    <div class="back-button">
                        <a href="{% url "details_house" house_pk=object.pk %}"><i
                                class="fa-solid fa-arrow-right"></i>{% trans "Back" %}</a>
                    </div>
                </div>
                {% include "house_bills/partials/other_bill_list.html" %}
                <div id="bill-modal-container"></div>
            </div>
        </div>
    </section>

{% endblock %}

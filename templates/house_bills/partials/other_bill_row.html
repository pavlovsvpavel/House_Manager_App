{% load i18n %}
<a id="bill-row-{{ bill.pk }}"
   class="{% if bill.is_paid %}client-card{% else %}client-card-not-paid{% endif %}"
   href="{% url 'edit_other_house_bills' house_pk=bill.house_id pk=bill.pk %}"
   {% if bill.is_paid %}data-revert-url="{% url 'revert_other_house_bills' house_pk=bill.house_id pk=bill.pk %}"{% endif %}
   hx-get="{% url 'edit_other_house_bills' house_pk=bill.house_id pk=bill.pk %}"
   hx-target="#bill-modal-container"
   hx-swap="innerHTML">
    <div class="card-column">
        <p class="column-name">{% trans "Year" %}</p>
        <p class="column-data">{{ bill.year }}</p>
    </div>
    <div class="card-column">
        <p class="column-name">{% trans "Month" %}</p>
        <p class="column-data">{{ bill.get_month_name }}</p>
    </div>
    <div class="card-column">
        <p class="column-name">{% trans "Type of bill" %}</p>
        <p class="column-data">{{ bill.get_type_of_bill }}</p>
    </div>
    <div class="card-column">
        <p class="column-name">{% trans "Total EUR" %}</p>
        <p class="column-data">{{ bill.total_amount }}</p>
    </div>
</a>

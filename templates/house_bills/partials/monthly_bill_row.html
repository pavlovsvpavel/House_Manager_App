{% load i18n %}
{% load common_tags %}
<a id="bill-row-{{ bill.pk }}"
   class="{% if bill.is_paid %}client-card{% else %}client-card-not-paid{% endif %}"
   href="{% url 'edit_house_bills' house_pk=bill.house_id pk=bill.pk %}{{ request|query_string }}"
   {% if bill.is_paid %}data-revert-url="{% url 'revert_house_bills' house_pk=bill.house_id pk=bill.pk %}{{ request|query_string }}"{% endif %}
   hx-get="{% url 'edit_house_bills' house_pk=bill.house_id pk=bill.pk %}{{ request|query_string }}"
   hx-target="#bill-modal-container"
   hx-swap="innerHTML">
    <div class="card-column">
        <p class="column-name">{% trans "Year" %}</p>
        <p class="column-data">{{ bill.year }}</p>
    </div>
    <div class="card-column">
        <p class="column-name">{% trans "Month" %}</p>
        <p class="column-data">{{ bill.get_month_name }}</p>
    </div>
    <div class="card-column">
        <p class="column-name">{% trans "Total, €" %}</p>
        <p class="column-data money">{{ bill.total_amount }}</p>
    </div>
</a>

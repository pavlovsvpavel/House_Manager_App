{% extends "base.html" %}
{% load i18n %}

{% block main_content %}
<section class="site-section login-register-user">
    <div class="container">
        <div class="form-container">
            <div class="forms">
                <div class="form-content">
                    <div class="verification-form">
                        <div class="create-form-heading">{% trans "Password changed" %}</div>
                        <p class="verification-note">
                            {% blocktranslate %}Your new password is set. Log in with it as usual.{% endblocktranslate %}
                        </p>
                        <a class="btn" href="{% url 'login_user' %}">{% trans "Back to login" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% load i18n %}
{% if bills_count or oob %}
    <p class="bills-summary" id="bills-summary" aria-live="polite"
       {% if oob %}hx-swap-oob="true"{% endif %}>
        {% trans "Bills" %}: <span class="money">{{ bills_count }}</span> ·
        {% trans "Unpaid" %}: <span class="money">{{ unpaid_count }}</span> ·
        {% trans "Due" %}: <span class="money">{{ unpaid_total }}</span> EUR
    </p>
{% endif %}

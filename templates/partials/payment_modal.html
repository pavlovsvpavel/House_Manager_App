{% load i18n %}
<dialog class="bill-modal" data-bill-modal aria-labelledby="bill-modal-title">
    <div class="bill-modal__panel">
        <div class="bill-modal__header">
            <p id="bill-modal-title" class="bill-modal__eyebrow">{% trans "Bill details" %}</p>
            <button type="button" class="bill-modal__close" data-close-modal
                    aria-label="{% trans 'Close' %}">&times;</button>
        </div>
        <div class="bill-modal__body">
            {% include details_template %}
            {% include form_template %}
        </div>
    </div>
</dialog>

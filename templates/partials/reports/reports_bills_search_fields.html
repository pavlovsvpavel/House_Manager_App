{% load static %}
{% load i18n %}

<script nonce="{{ csp_nonce }}" src="{% static "scripts/html2canvas-pro.min.js" %}" defer></script>
<script nonce="{{ csp_nonce }}" src="{% static "scripts/jspdf.umd.min.js" %}" defer></script>
<script nonce="{{ csp_nonce }}" src="{% static "scripts/exportToPdf.js" %}" defer></script>

<form class="search_by_month_and_year" method="get">
    {% include "partials/reports/month_picker.html" %}
    {% include "partials/reports/year_picker.html" %}
    <div class="action-buttons-reports">
        <button class="search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button type="button" id="generatePdf" class="save-btn">{% trans "Save as PDF" %}</button>
    </div>
</form>

{% load i18n %}
{% load custom_filters %}
<tr>
    <td data-label="{% trans "Family Name" %}">{{ client_bill.client.family_name }}</td>
    <td data-label="{% trans "Apartment" %}">{{ client_bill.client.apartment }}</td>
    <td data-label="{% trans "Unpaid bills, EUR" %}" class="money money--right">{{ client_bill.amount_old_debts }}</td>
    <td data-label="{% trans "Monthly bill, EUR" %}" class="money money--right">{{ client_bill.total_amount }}</td>  <!-- Total amount searched month/year client_monthly bill -->
    <td data-label="{% trans "Total, EUR" %}" class="money money--right">{{ client_bill.amount_old_debts|add:client_bill.total_amount }}</td>
    <td data-label="{% trans "Signature" %}" class="signature-column">
        {% if client_bill.signature %}
        <div>
            <img src="{{ client_bill.signature }}" alt="Signature"/>
        </div>
    {% else %}
        <div></div>
    {% endif %}
    </td>
</tr>

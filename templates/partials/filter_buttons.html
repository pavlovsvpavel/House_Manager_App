{% load i18n %}
<!-- Bill filters as a compact dropdown row: one native <select> per facet
     (Status, Year, Month). A native select IS the no-JS radio dropdown —
     single choice, keyboard and screen-reader support and the mobile picker
     sheet come for free. The form submits every facet together, so the
     filters compose freely (?is_paid=&year=&month=), and the Apply button is
     the no-JS fallback: it hides itself once htmx is running. -->
<form class="bill-filters" method="get" action=""
      {% if filter_target %}hx-get="{{ request.path }}"
      hx-target="{{ filter_target }}"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-trigger="submit, change"
      hx-sync="this:replace"
      hx-indicator="#bills-skeleton"{% endif %}>
    <label class="filter-facet{% if request.GET.is_paid %} filter-facet--active{% endif %}"
           for="filter-is-paid">
        <span class="filter-facet__label">{% trans "Status" %}</span>
        <span class="filter-facet__select">
            <select id="filter-is-paid" name="is_paid">
                <option value=""{% if request.GET.is_paid != "True" and request.GET.is_paid != "False" %} selected{% endif %}>{% trans "All" %}</option>
                <option value="False"{% if request.GET.is_paid == "False" %} selected{% endif %}>{% trans "Unpaid" %}</option>
                <option value="True"{% if request.GET.is_paid == "True" %} selected{% endif %}>{% trans "Paid" context "filter chips: plural, next to Неплатени/Всички" %}</option>
            </select>
        </span>
    </label>

    <label class="filter-facet{% if request.GET.year %} filter-facet--active{% endif %}"
           for="filter-year">
        <span class="filter-facet__label">{% trans "Year" %}</span>
        <span class="filter-facet__select">
            <select id="filter-year" name="year">
                <option value=""{% if not request.GET.year %} selected{% endif %}>{% trans "All" %}</option>
                {% for choice in YearChoices %}
                    <option value="{{ choice.0 }}"{% if request.GET.year == choice.0 %} selected{% endif %}>{{ choice.0 }}</option>
                {% endfor %}
            </select>
        </span>
    </label>

    <label class="filter-facet{% if request.GET.month %} filter-facet--active{% endif %}"
           for="filter-month">
        <span class="filter-facet__label">{% trans "Month" %}</span>
        <span class="filter-facet__select">
            <select id="filter-month" name="month">
                <option value=""{% if not request.GET.month %} selected{% endif %}>{% trans "All" %}</option>
                {% for choice in MonthChoices.choices %}
                    <option value="{{ choice.0 }}"{% if request.GET.month == choice.0 %} selected{% endif %}>{{ choice.1 }}</option>
                {% endfor %}
            </select>
        </span>
    </label>

    <button type="submit" class="filter-apply">{% trans "Apply" %}</button>
</form>

{% if filter_target %}
{% comment %}Only htmx itself can fire htmx:load, so the class marks
"HTMX is genuinely running" - the Apply fallback stays visible otherwise.{% endcomment %}
<script nonce="{{ csp_nonce }}">
    document.addEventListener('htmx:load', function () {
        document.documentElement.classList.add('htmx-running');
    });
</script>
{% endif %}

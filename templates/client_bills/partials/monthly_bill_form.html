{% load static %}
{% load i18n %}
<form class="bill-form" method="post"
      action="{% url 'edit_client_bill' house_pk=object.house_id client_pk=object.client_id pk=object.pk %}"
      hx-post="{% url 'edit_client_bill' house_pk=object.house_id client_pk=object.client_id pk=object.pk %}"
      hx-target="#bill-row-{{ object.pk }}"
      hx-swap="outerHTML settle:400ms">
    {% csrf_token %}
    <label class="bill-form__switch" for="id_is_paid">
        {{ form.is_paid }}
        <span class="bill-form__track" aria-hidden="true"></span>
        <span class="bill-form__switch-label">{% if form.instance.is_paid %}{% trans "Paid" %}{% else %}{% trans "Mark as paid" %}{% endif %}</span>
    </label>

    {% if form.instance.is_paid %}
        {% include "partials/signature-show.html" %}
        <div class="bill-form__actions">
            <a href="{% url 'download_receipt' house_pk=object.house_id client_pk=object.client_id pk=object.pk %}"
               class="bill-form__receipt" target="_blank">
                {% trans "Download Receipt" %}
            </a>
        </div>
    {% else %}
        {% include "partials/signature-pad.html" %}
        <div class="bill-form__actions">
            {% include "partials/bill_form_buttons.html" %}
        </div>
    {% endif %}
</form>
